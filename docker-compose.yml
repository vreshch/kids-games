services:
  web:
    image: ghcr.io/vreshch/kids-games:latest
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - traefik-public
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        - traefik.constraint-label=traefik-public

        - traefik.http.routers.kids-games-http.rule=Host(`games.vreshch.com`)
        - traefik.http.routers.kids-games-http.entrypoints=http
        - traefik.http.routers.kids-games-http.middlewares=https-redirect

        # same definition every stack here declares; Traefik dedupes it
        - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true

        - traefik.http.routers.kids-games-https.rule=Host(`games.vreshch.com`)
        - traefik.http.routers.kids-games-https.entrypoints=https
        - traefik.http.routers.kids-games-https.tls=true
        - traefik.http.routers.kids-games-https.tls.certresolver=letsencrypt

        - traefik.http.services.kids-games.loadbalancer.server.port=3000

      resources:
        limits:
          cpus: '0.4'
          memory: 192M
        reservations:
          cpus: '0.1'
          memory: 64M

    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Passes messages between two players of one room; rooms live in memory only.
  relay:
    image: ghcr.io/vreshch/kids-games:latest
    command: ['node', 'relay/relay.ts']
    restart: unless-stopped
    environment:
      RELAY_HOST: 0.0.0.0
      RELAY_PORT: '3001'
      RELAY_ORIGINS: https://games.vreshch.com
    networks:
      - traefik-public
    deploy:
      replicas: 1
      update_config:
        # two relays at once would split a room between them
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        - traefik.constraint-label=traefik-public

        - traefik.http.routers.kids-games-relay.rule=Host(`games.vreshch.com`) && PathPrefix(`/relay/`)
        - traefik.http.routers.kids-games-relay.entrypoints=https
        - traefik.http.routers.kids-games-relay.tls=true
        - traefik.http.routers.kids-games-relay.tls.certresolver=letsencrypt
        - traefik.http.routers.kids-games-relay.service=kids-games-relay

        - traefik.http.services.kids-games-relay.loadbalancer.server.port=3001

      resources:
        limits:
          cpus: '0.2'
          memory: 96M
        reservations:
          cpus: '0.05'
          memory: 32M

    healthcheck:
      test:
        ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3001/relay/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  traefik-public:
    external: true
